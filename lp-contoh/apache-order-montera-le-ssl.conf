<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName order.montera-group.com
    DocumentRoot /var/www/lp
    RedirectMatch 302 ^/$ /lipseed-oil/

    <Directory /var/www/lp>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Gambar LP jarang berubah, jadi disimpan peramban 30 hari supaya
    # pengunjung dari iklan tidak mengunduh ulang tiap kali membuka.
    <FilesMatch "\.(jpg|jpeg|png|webp|svg|ico)$">
        Header set Cache-Control "public, max-age=2592000"
    </FilesMatch>

    ErrorLog  ${APACHE_LOG_DIR}/order-montera-error.log
    CustomLog ${APACHE_LOG_DIR}/order-montera-access.log combined

SSLCertificateFile /etc/letsencrypt/live/order.montera-group.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/order.montera-group.com/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
